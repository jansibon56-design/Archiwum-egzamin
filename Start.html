<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test AU.64</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="start-screen" class="card">
      <h1>Test egzaminacyjny AU.64</h1>
      <p>Program losuje 40 pytań z bazy. Po zakończeniu testu zobaczysz wynik oraz pełny podgląd odpowiedzi.</p>
      <button id="start-btn" class="primary">Rozpocznij test</button>
      <p id="load-error" class="error hidden"></p>
    </section>

    <section id="quiz-screen" class="card hidden">
      <div class="topbar">
        <div>
          <strong id="progress">Pytanie 1/40</strong>
          <div id="source" class="muted"></div>
        </div>
        <div class="topbar-right">
          <div id="timer" class="timer">60:00</div>
          <div id="answered-counter" class="muted"></div>
        </div>
      </div>

      <div id="image-wrap" class="image-wrap hidden">
        <img id="question-image" alt="Ilustracja do pytania" />
      </div>

      <h2 id="question-text"></h2>

      <div id="answers" class="answers"></div>

      <div class="nav">
        <button id="next-btn">Następne</button>
        <button id="finish-btn" class="primary">Zakończ test</button>
      </div>
    </section>

    <section id="result-screen" class="card hidden">
      <h1>Wynik testu</h1>
      <p id="score" class="score"></p>
      <div class="nav">
        <button id="review-btn" class="primary">Pokaż odpowiedzi</button>
        <button id="restart-btn">Nowy test</button>
      </div>
    </section>

    <section id="review-screen" class="hidden">
      <div class="card">
        <h1>Podgląd odpowiedzi</h1>
        <p id="review-summary" class="score"></p>
        <button id="back-result-btn">Wróć do wyniku</button>
      </div>
      <div id="review-list"></div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
